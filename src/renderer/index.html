<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Dash</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header><h1>Claude Dash</h1><span class="stat" id="stats"></span><span class="burn" id="burn"></span><button id="drawerBtn" class="hbtn" type="button" aria-expanded="true">Activity</button><span class="mut" id="conn">connecting…</span></header>
<main><section><h2>Sessions <div class="dd" id="filterDd"></div><input id="q" type="search" placeholder="Search" aria-label="Search sessions"><div class="dd" id="colsDd" hidden></div><div class="dd" id="sortDd"></div></h2><div class="cards" id="cards"></div></section><aside id="drawer"><div class="dh"><h2>Activity</h2><span class="dbtns"><button id="pinBtn" class="hbtn" type="button" title="Pin drawer open">Pin</button><button id="closeBtn" class="hbtn" type="button" title="Close">✕</button></span></div><div class="feed" id="feed"></div></aside></main>
<script type="module" src="./main.js"></script>
</body>
</html>
