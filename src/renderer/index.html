<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Dash</title>
<style>
:root{--bg:#111315;--panel:#1a1d20;--line:#2a2e33;--fg:#e6e8ea;--mut:#8a9199;--work:#4da3ff;--wait:#ffb020;--idle:#4cc38a;--stale:#6b7280;--end:#444}
@media (prefers-color-scheme: light){:root{--bg:#f5f6f7;--panel:#fff;--line:#dde0e4;--fg:#1c1f23;--mut:#6b737b;--stale:#9aa1a9;--end:#bbb}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 -apple-system,system-ui,sans-serif}
header{display:flex;gap:16px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg)}
h1{font-size:16px;margin:0;flex:1}
.stat{color:var(--mut)}.stat b{color:var(--fg)}
main{display:grid;grid-template-columns:1fr 340px;gap:20px;padding:20px}
@media(max-width:800px){main{grid-template-columns:1fr}}
.cards{display:grid;gap:12px;align-content:start}
.card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:12px 14px}
.card.waiting{--c:var(--wait)}.card.working{--c:var(--work)}.card.idle{--c:var(--idle)}.card.stale{--c:var(--stale)}.card.ended{--c:var(--end);opacity:.6}
.top{display:flex;justify-content:space-between;gap:8px}
.proj{font-weight:600}
.badge{font-size:12px;color:var(--c);text-transform:uppercase;letter-spacing:.04em}
.mut{color:var(--mut);font-size:12px}
.tool{font-family:ui-monospace,Menlo,monospace;font-size:12px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prompt{margin-top:6px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg{margin-top:6px;color:var(--wait)}
aside h2{font-size:13px;margin:0 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.feed{background:var(--panel);border:1px solid var(--line);border-radius:8px;max-height:75vh;overflow:auto}
.row{padding:6px 10px;border-bottom:1px solid var(--line);font-size:12px;display:grid;grid-template-columns:56px 1fr;gap:8px}
.row:last-child{border:0}
.row .d{color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--mut);padding:40px;text-align:center}
</style>
</head>
<body>
<header><h1>Claude Dash</h1><span class="stat" id="stats"></span><span class="mut" id="conn">connecting…</span></header>
<main><div class="cards" id="cards"></div><aside><h2>Activity</h2><div class="feed" id="feed"></div></aside></main>
<script>
let snap = { sessions: [], feed: [], now: Date.now() };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function dur(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  if (s < 60) return s + 's';
  if (s < 3600) return Math.floor(s / 60) + 'm ' + (s % 60) + 's';
  return Math.floor(s / 3600) + 'h ' + Math.floor((s % 3600) / 60) + 'm';
}
function render() {
  const now = snap.now;
  const by = (st) => snap.sessions.filter((s) => s.displayState === st).length;
  $('stats').innerHTML = `<b>${by('working')}</b> working · <b>${by('waiting')}</b> waiting · <b>${by('idle')}</b> idle`;
  $('cards').innerHTML = snap.sessions.length ? snap.sessions.map((s) => `
    <div class="card ${s.displayState}">
      <div class="top"><span class="proj">${esc(s.project)}</span><span class="badge">${s.displayState} · ${dur(now - s.stateSince)}</span></div>
      <div class="mut">${esc(s.cwd)} · ${s.toolCount} tools${s.subagents ? ` · ${s.subagents} subagent${s.subagents > 1 ? 's' : ''}` : ''} · up ${dur(now - s.startedAt)}</div>
      ${s.message ? `<div class="msg">${esc(s.message)}</div>` : ''}
      ${s.tool ? `<div class="tool">▸ ${esc(s.tool)} ${esc(s.toolDetail)}</div>` : ''}
      ${s.prompt ? `<div class="prompt">“${esc(s.prompt)}”</div>` : ''}
    </div>`).join('') : '<div class="empty">No sessions yet. Start Claude Code with the claude-dash plugin enabled.</div>';
  $('feed').innerHTML = snap.feed.map((f) => `
    <div class="row"><span class="mut">${new Date(f.t).toLocaleTimeString([], { hour12: false })}</span>
    <span><b>${esc(f.project)}</b> ${esc(f.event)} ${esc(f.tool)}<div class="d">${esc(f.detail)}</div></span></div>`).join('');
}
function connect() {
  const es = new EventSource('/api/stream');
  es.onopen = () => { $('conn').textContent = 'live'; };
  es.onmessage = (m) => { snap = JSON.parse(m.data); render(); };
  es.onerror = () => { $('conn').textContent = 'reconnecting…'; };
}
connect();
setInterval(() => { snap.now = Date.now(); render(); }, 1000);
</script>
</body>
</html>
