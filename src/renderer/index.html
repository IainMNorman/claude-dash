<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Dash</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header><h1>Claude Dash</h1><span class="stat" id="stats"></span><button id="drawerBtn" class="hbtn" type="button" aria-expanded="true">Activity</button><span class="mut" id="conn">connecting…</span></header>
<main><section><h2>Sessions <select id="filter" aria-label="Filter sessions"><option value="live">Live</option><option value="waiting">Waiting</option><option value="working">Working</option><option value="stuck">Quiet?</option><option value="stale">Stale</option><option value="ended">Ended</option><option value="dismissed">Dismissed</option><option value="all">All</option></select><input id="q" type="search" placeholder="Search" aria-label="Search sessions"><select id="sort" aria-label="Sort sessions"><option value="status">Status</option><option value="latest">Latest event</option><option value="name">Name</option><option value="state">Longest in state</option><option value="tools">Most tools</option><option value="started">Newest session</option></select></h2><div class="cards" id="cards"></div></section><aside id="drawer"><div class="dh"><h2>Activity</h2><span class="dbtns"><button id="pinBtn" class="hbtn" type="button" title="Pin drawer open">Pin</button><button id="closeBtn" class="hbtn" type="button" title="Close">✕</button></span></div><div class="feed" id="feed"></div></aside></main>
<script type="module" src="./main.js"></script>
</body>
</html>
